services:
  # Backend Rails 8 API Web Service
  - type: web
    name: acme-salary-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: acme_salary_production
      - key: DB_SSL_MODE
        value: required
      - key: FRONTEND_URL
        sync: false

  # Frontend Vite React Static Site
  - type: web
    name: acme-salary-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /api/*
        destination: https://acme-salary-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: acme-salary-backend
          property: url
